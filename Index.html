<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>App Hub Pro</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b1220;
    color: white;
}

/* NAV */
nav {
    display: flex;
    justify-content: center;
    background: rgba(30,41,59,0.9);
    padding: 12px;
    position: sticky;
    top: 0;
}

nav button {
    margin: 5px;
    padding: 10px 14px;
    border: none;
    cursor: pointer;
    border-radius: 8px;
    background: #334155;
    color: white;
    transition: 0.2s;
}

nav button:hover {
    background: #3b82f6;
}

/* SECTIONS */
section {
    display: none;
    padding: 30px;
    text-align: center;
}

.active {
    display: block;
}

/* CARDS */
.card {
    background: rgba(30,41,59,0.8);
    padding: 15px;
    margin: 10px auto;
    width: 320px;
    border-radius: 12px;
    transition: 0.2s;
}

.card:hover {
    transform: scale(1.03);
}

/* INPUT */
input {
    padding: 10px;
    width: 70%;
    border-radius: 8px;
    border: none;
    outline: none;
}

button.action {
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: #3b82f6;
    color: white;
    cursor: pointer;
}

/* GLASS EFFECT HEADER */
h1 {
    margin-top: 20px;
    color: #60a5fa;
}
</style>
</head>

<body>

<nav>
    <button onclick="show('home')">Home</button>
    <button onclick="show('tasks')">Tasks</button>
    <button onclick="show('chat')">Chat</button>
    <button onclick="show('music')">Music</button>
</nav>

<!-- HOME -->
<section id="home" class="active">
    <h1>🚀 App Hub Pro</h1>
    <p>All-in-one mini web app system</p>
</section>

<!-- TASKS -->
<section id="tasks">
    <h1>🅰️ Task Manager</h1>

    <input id="taskInput" placeholder="Enter task">
    <button class="action" onclick="addTask()">Add</button>

    <div id="taskList"></div>
</section>

<!-- CHAT -->
<section id="chat">
    <h1>🅱️ Chat UI</h1>

    <div id="chatBox">
        <div class="card">User: Hello 👋</div>
        <div class="card">You: Hi!</div>
    </div>

    <input id="chatInput" placeholder="Type message">
    <button class="action" onclick="sendMsg()">Send</button>
</section>

<!-- MUSIC -->
<section id="music">
    <h1>🎧 Music Player</h1>

    <div class="card">
        🎵 Chill Beats
        <br><br>
        <button class="action" onclick="alert('Playing music...')">Play</button>
    </div>
</section>

<script>
function show(id){
    document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

/* TASKS */
function addTask(){
    let input = document.getElementById("taskInput");
    if(input.value === "") return;

    let div = document.createElement("div");
    div.className = "card";
    div.innerText = input.value;

    document.getElementById("taskList").appendChild(div);
    input.value = "";
}

/* CHAT */
function sendMsg(){
    let input = document.getElementById("chatInput");
    if(input.value === "") return;

    let div = document.createElement("div");
    div.className = "card";
    div.innerText = "You: " + input.value;

    document.getElementById("chatBox").appendChild(div);
    input.value = "";
}
</script>

</body>
</html>
