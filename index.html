<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notes App</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
    display: flex;
    justify-content: center;
    padding: 40px;
}

.container {
    width: 400px;
}

h1 {
    text-align: center;
    color: #60a5fa;
}

input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    margin-bottom: 10px;
    outline: none;
}

button {
    width: 100%;
    padding: 12px;
    background: #3b82f6;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #2563eb;
}

.note {
    background: #1e293b;
    padding: 10px;
    margin-top: 10px;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
}

.delete {
    background: red;
    border: none;
    color: white;
    padding: 5px 8px;
    border-radius: 5px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
    <h1>📒 Notes App</h1>

    <input id="noteInput" placeholder="Write a note...">
    <button onclick="addNote()">Add Note</button>

    <div id="notes"></div>
</div>

<script>
let notes = JSON.parse(localStorage.getItem("notes")) || [];

function renderNotes() {
    const container = document.getElementById("notes");
    container.innerHTML = "";

    notes.forEach((note, index) => {
        container.innerHTML += `
        <div class="note">
            <span>${note}</span>
            <button class="delete" onclick="deleteNote(${index})">X</button>
        </div>
        `;
    });

    localStorage.setItem("notes", JSON.stringify(notes));
}

function addNote() {
    let input = document.getElementById("noteInput");
    if (input.value === "") return;

    notes.push(input.value);
    input.value = "";
    renderNotes();
}

function deleteNote(index) {
    notes.splice(index, 1);
    renderNotes();
}

renderNotes();
</script>

</body>
</html>
